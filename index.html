<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BotMarket — готовые Telegram-боты</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --bg: #0f1320; --card: #171c2e; --accent: #ffb020; --text: #e8ebf5; --muted: #9aa3b8; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 16px; max-width: 560px; margin: 0 auto; }
  header { text-align: center; padding: 20px 0 12px; }
  h1 { font-size: 22px; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); font-size: 14px; margin-top: 6px; line-height: 1.45; }
  .product { background: var(--card); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
  .product h2 { font-size: 17px; margin-bottom: 6px; }
  .product p { color: var(--muted); font-size: 14px; line-height: 1.45; margin-bottom: 10px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .price { color: var(--accent); font-weight: 700; white-space: nowrap; }
  .old { color: var(--muted); text-decoration: line-through; font-weight: 400; font-size: 13px; margin-right: 6px; }
  .btn { display: inline-block; background: var(--accent); color: #10131f; font-weight: 700; border: 0; border-radius: 10px; padding: 10px 16px; font-size: 14px; cursor: pointer; text-decoration: none; text-align: center; }
  .btn:active { transform: scale(0.98); }
  footer { color: var(--muted); font-size: 12px; text-align: center; padding: 16px 0; line-height: 1.5; }
</style>
</head>
<body>
<header>
  <h1>Bot<span>Market</span> 🤖</h1>
  <div class="sub">Готовые Telegram-боты с исходным кодом. Оплата в пару нажатий — файл приходит сразу. 🛠 Нужна своя логика — установка под ключ.</div>
</header>

<div id="catalog">Загружаю каталог…</div>

<footer>
  Нажми «Открыть в боте», чтобы оформить покупку.<br>
  💬 Поддержка — в самом боте.
</footer>

<script>
const BOT_USERNAME = "ВАШ_БОТ_БЕЗ_СОБАКИ";  // впиши username бота

function tgLink(productId) {
  return "https://t.me/" + BOT_USERNAME + "?start=product_" + productId;
}

async function load() {
  try {
    const res = await fetch("catalog.json");
    const products = await res.json();
    const root = document.getElementById("catalog");
    root.innerHTML = "";
    products.forEach(p => {
      const div = document.createElement("div");
      div.className = "product";
      const promo = p.promo_percent ? ` <span class="old">⭐ ${p.stars}</span> ⭐ ${p.promo_stars}` : "";
      div.innerHTML = `
        <h2>${p.name}</h2>
        <p>${p.description}</p>
        <div class="row">
          <span class="price">${promo || "⭐ " + p.stars}</span>
          <a class="btn" href="${tgLink(p.id)}">Открыть в боте →</a>
        </div>`;
      root.appendChild(div);
    });
  } catch (e) {
    document.getElementById("catalog").textContent = "Каталог временно недоступен.";
  }
}

// Раскрываем окно Telegram и сообщаем, что страница готова
try {
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();
} catch (e) {}

load();
</script>
</body>
</html>
